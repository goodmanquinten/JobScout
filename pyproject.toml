[project]
name = "jobscout"
version = "0.1.0"
description = "Weekly job finder: job boards + Handshake alerts, Claude-scored, Telegram digest."
readme = "README.md"
authors = [{ name = "Quinten Goodman", email = "Quinten@goodmansonline.com" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.4.0",
    "google-auth>=2.40.0",
    "google-auth-oauthlib>=1.2.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "tzdata>=2025.2",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: calls real external APIs (needs keys)"]
